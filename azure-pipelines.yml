trigger: none

stages:
- stage: TestAgent
  jobs:
  - job: Test
    pool:
      name: Default

    steps:
    - powershell: |
        Write-Host "Running on: $env:COMPUTERNAME"
        Write-Host "Client ID: $env:AZURE_CLIENT_ID"

        # Debug check
        if (-not $env:AZURE_CLIENT_SECRET) {
          throw "AZURE_CLIENT_SECRET is EMPTY ❌"
        }

        # Login using Service Principal
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password="$env:AZURE_CLIENT_SECRET" `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID
        az account show

      displayName: "Login to Azure using SP"

      env:   # 👈 THIS IS THE KEY FIX
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
