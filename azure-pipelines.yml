trigger: none

variables:
  VM_NAME: "<your-worker-vm-name>"
  RESOURCE_GROUP: "<your-resource-group>"

stages:

# =========================================
# STAGE 1: Start VM (Needs Azure Login)
# =========================================
- stage: CheckVM
  displayName: "Start Worker VM"
  jobs:
  - job: CheckAndStart
    pool:
      name: Default
      demands:
        - Agent.Name -equals test-vm

    steps:
    - powershell: |
        Write-Host "===== CONTROLLER AGENT ====="
        Write-Host "Machine: $env:COMPUTERNAME"

        # Login to Azure using Service Principal
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password="$env:AZURE_CLIENT_SECRET" `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        $vmName = "$(VM_NAME)"
        $rg = "$(RESOURCE_GROUP)"

        Write-Host "Checking VM status..."

        $status = az vm get-instance-view `
          --name $vmName `
          --resource-group $rg `
          --query "instanceView.statuses[?code=='PowerState/running']" `
          --output tsv

        if (-not $status) {
          Write-Host "Starting VM..."
          az vm start --name $vmName --resource-group $rg
        } else {
          Write-Host "VM already running."
        }

        Write-Host "Waiting for VM boot..."
        Start-Sleep -Seconds 120

      displayName: "Start VM"
      env:
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

# =========================================
# STAGE 2: Build / Deploy (NO Azure Login)
# =========================================
- stage: RunPipeline
  displayName: "Run Build & Deploy"
  dependsOn: CheckVM
  jobs:
  - job: BuildAndDeploy
    pool:
      name: SHA
      demands:
        - Agent.Name -equals test-vms

    steps:
    - powershell: |
        Write-Host "===== WORKER AGENT ====="
        Write-Host "Machine: $env:COMPUTERNAME"
        Write-Host "Agent: $env:AGENT_NAME"

        Write-Host "Running build and deploy logic..."

        # Replace with your real steps
        Write-Host "Build..."
        Write-Host "Test..."
        Write-Host "Deploy..."

      displayName: "Build & Deploy"

# =========================================
# STAGE 3: Shutdown VM (Needs Azure Login)
# =========================================
- stage: ShutdownVM
  displayName: "Shutdown Worker VM"
  dependsOn: RunPipeline
  condition: always()

  jobs:
  - job: StopVM
    pool:
      name: Default
      demands:
        - Agent.Name -equals test-vm

    steps:
    - powershell: |
        Write-Host "===== CLEANUP ====="

        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password="$env:AZURE_CLIENT_SECRET" `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        $vmName = "$(VM_NAME)"
        $rg = "$(RESOURCE_GROUP)"

        Write-Host "Stopping VM..."
        az vm deallocate --name $vmName --resource-group $rg

      displayName: "Shutdown VM"
      env:
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
