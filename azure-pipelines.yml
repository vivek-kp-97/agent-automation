trigger: none

variables:
  VM_NAME: "<your-worker-vm-name>"
  RESOURCE_GROUP: "<your-resource-group>"
  SUBSCRIPTION_ID: "$(AZURE_SUBSCRIPTION_ID)"

stages:

# -------------------------
# Stage 1: Login + Start VM
# -------------------------
- stage: CheckVM
  displayName: "Login & Start Worker VM"
  jobs:
  - job: CheckAndStart
    timeoutInMinutes: 15
    pool:
      name: Default
      demands:
        - Agent.Name -equals test-vm

    steps:
    - powershell: |
        Write-Host "===== CONTROLLER AGENT ====="
        Write-Host "Machine: $env:COMPUTERNAME"
        Write-Host "Agent: $env:AGENT_NAME"

        # Login using Service Principal
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure login failed"
          exit 1
        }

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        Write-Host "Azure context:"
        az account show

        $vmName = "$(VM_NAME)"
        $rg = "$(RESOURCE_GROUP)"

        Write-Host "Checking VM status..."

        $status = az vm get-instance-view `
          --name $vmName `
          --resource-group $rg `
          --query "instanceView.statuses[?code=='PowerState/running']" `
          --output tsv

        if (-not $status) {
          Write-Host "VM not running. Starting..."
          az vm start --name $vmName --resource-group $rg

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to start VM"
            exit 1
          }
        } else {
          Write-Host "VM already running."
        }

        Write-Host "Waiting for VM boot + agent registration..."
        Start-Sleep -Seconds 120

      displayName: "Login & Start VM"

# -------------------------
# Stage 2: Run on SHA Agent
# -------------------------
- stage: RunPipeline
  displayName: "Run Workload on SHA"
  dependsOn: CheckVM
  jobs:
  - job: RunOnWorker
    timeoutInMinutes: 60
    pool:
      name: SHA
      demands:
        - Agent.Name -equals test-vms

    steps:
    - powershell: |
        Write-Host "===== WORKER AGENT ====="
        Write-Host "Machine: $env:COMPUTERNAME"
        Write-Host "Agent: $env:AGENT_NAME"

        # Login again (important: each agent is isolated)
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        Write-Host "Azure context:"
        az account show

        Write-Host "Listing VMs..."
        az vm list -o table

      displayName: "Run workload"

# -------------------------
# Stage 3: Shutdown VM
# -------------------------
- stage: ShutdownVM
  displayName: "Shutdown Worker VM"
  dependsOn: RunPipeline
  condition: always()

  jobs:
  - job: StopVM
    pool:
      name: Default
      demands:
        - Agent.Name -equals test-vm

    steps:
    - powershell: |
        Write-Host "===== CLEANUP STAGE ====="
        Write-Host "Machine: $env:COMPUTERNAME"
        Write-Host "Agent: $env:AGENT_NAME"

        # Login again
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        $vmName = "$(VM_NAME)"
        $rg = "$(RESOURCE_GROUP)"

        Write-Host "Stopping VM..."
        az vm deallocate --name $vmName --resource-group $rg

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to stop VM"
          exit 1
        }

      displayName: "Shutdown VM"
