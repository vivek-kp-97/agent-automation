trigger: none

variables:
  VM_NAME: $(VM_NAME)
  RESOURCE_GROUP: $(RESOURCE_GROUP)

stages:
# Stage 1: Start VM + Wait for Readiness

- stage: CheckVM
  displayName: "Start VM and Wait for Agent"
  jobs:
  - job: StartVM
    pool:
      name: Default

    steps:
    - powershell: |
        Write-Host "Controller Agent: $env:COMPUTERNAME"

        $vmName = "$(VM_NAME)"
        $rg = "$(RESOURCE_GROUP)"

        if (-not $vmName -or -not $rg) {
          Write-Error "VM_NAME or RESOURCE_GROUP not set"
          exit 1
        }

        Write-Host "Logging into Azure..."
        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password="$env:AZURE_CLIENT_SECRET" `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        Write-Host "Checking VM status..."
        $status = az vm get-instance-view `
          --name $vmName `
          --resource-group $rg `
          --query "instanceView.statuses[1].displayStatus" -o tsv

        Write-Host "Current Status: $status"

        if ($status -ne "VM running") {
          Write-Host "Starting VM (async)..."
          az vm start --name $vmName --resource-group $rg --no-wait
        } else {
          Write-Host "VM already running."
        }

        Write-Host "Waiting for VM to be in running state..."
        $maxAttempts = 60
        $attempt = 0

        do {
          Start-Sleep -Seconds 10
          $attempt++

          $status = az vm get-instance-view `
            --name $vmName `
            --resource-group $rg `
            --query "instanceView.statuses[1].displayStatus" -o tsv

          Write-Host "Attempt $attempt : VM Status = $status"

        } while ($status -ne "VM running" -and $attempt -lt $maxAttempts)

        if ($status -ne "VM running") {
          Write-Error "VM did not reach running state"
          exit 1
        }

        Write-Host "VM is running"

        Write-Host "Checking Azure DevOps agent service..."

        $maxAttempts = 30
        $attempt = 0

        do {
          Start-Sleep -Seconds 10
          $attempt++

          $result = az vm run-command invoke `
            --resource-group $rg `
            --name $vmName `
            --command-id RunPowerShellScript `
            --scripts "Get-Service vstsagent* | Select -ExpandProperty Status" `
            --query "value[0].message" -o tsv

          Write-Host "Attempt $attempt : Agent Status = $result"

        } while ($result -notmatch "Running" -and $attempt -lt $maxAttempts)

        if ($result -notmatch "Running") {
          Write-Error "Agent is not running"
          exit 1
        }

        Write-Host "Agent is ONLINE "

      env:
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)


# Stage 2: Run Workload on SHA Agent
- stage: RunPipeline
  displayName: "Run Workload on SHA Agent"
  dependsOn: CheckVM

  jobs:
  - job: Run
    pool:
      name: SHA

    steps:
    - powershell: |
        Write-Host "Worker Agent: $env:COMPUTERNAME"
        Write-Host "Pipeline execution started on SHA agent "


# Stage 3: Graceful Shutdown
- stage: ShutdownVM
  displayName: "Shutdown VM"
  dependsOn: RunPipeline
  condition: always()

  jobs:
  - job: StopVM
    pool:
      name: Default

    steps:
    - powershell: |
        Write-Host "Logging into Azure..."

        az login --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password="$env:AZURE_CLIENT_SECRET" `
          --tenant $env:AZURE_TENANT_ID

        az account set --subscription $env:AZURE_SUBSCRIPTION_ID

        Write-Host "Stopping VM..."
        az vm deallocate --name "$(VM_NAME)" --resource-group "$(RESOURCE_GROUP)"

        Write-Host "VM stopped "

      env:
        AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
        AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
        AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
